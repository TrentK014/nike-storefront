# Code primitives for the Agentic QA Fleet: what the storefront is, what to
# cover, and what must never break.
# Format: https://github.com/joshmkim/qa-agent/blob/main/docs/code-primitives.md
# Validate locally: pnpm --filter @qa-agent/control-plane manifest:check .qa/manifest.yaml
version: 1

product:
  name: Nike Storefront
  intent: >-
    Shoppers browse shoes by category (men, women, kids, sport, classics, sale)
    or from the home page's New Arrivals and What's Trending tabs, open a shoe
    to pick a size and quantity, favorite shoes, add sized items to their bag,
    and check out with an optional discount code. Stock is reserved when an item
    is added to the bag, released when it is removed, and deducted when an order
    is placed. Sale prices come from each size and color's sale_percent, so one
    shoe can have different prices per size. Signing in is required for the bag,
    checkout, favorites, and profile; there is no sign-up page (accounts are
    provisioned). Signed-in shoppers see what they have purchased on their
    profile and can review each purchased shoe once, with a 1 to 5 star rating
    and optional text. Contact, delivery, and payment fields at checkout are
    display only; no payment is processed.
  stakeholders: [storefront team, merchandising, customer support]

surfaces:
  # Shared shell: every page renders inside StorefrontLayout (nav bar with bag count, product grid).
  - id: layout-nav
    kind: flow
    name: Storefront layout and nav bar
    locator: "nav"
    description: Top navigation, bag count badge, product grid with favorite hearts.
    sources: [src/components/StorefrontLayout.tsx, src/components/NavBar.tsx, src/app/layout.tsx, src/app/globals.css]

  - id: home
    kind: page
    name: Home
    locator: /
    sources: [src/app/page.tsx]
  - id: category-men
    kind: page
    name: Men
    locator: /men
    sources: [src/app/men/**, src/lib/category-shoes.ts, src/components/ProductGridWithFavorites.tsx, src/components/ProductCard.tsx, src/components/SaleSticker.tsx]
  - id: category-women
    kind: page
    name: Women
    locator: /women
    sources: [src/app/women/**, src/lib/category-shoes.ts, src/components/ProductGridWithFavorites.tsx, src/components/ProductCard.tsx, src/components/SaleSticker.tsx]
  - id: category-kids
    kind: page
    name: Kids
    locator: /kids
    sources: [src/app/kids/**, src/lib/category-shoes.ts, src/components/ProductGridWithFavorites.tsx, src/components/ProductCard.tsx, src/components/SaleSticker.tsx]
  - id: category-sport
    kind: page
    name: Sport
    locator: /sport
    sources: [src/app/sport/**, src/lib/category-shoes.ts, src/components/ProductGridWithFavorites.tsx, src/components/ProductCard.tsx, src/components/SaleSticker.tsx]
  - id: category-classics
    kind: page
    name: Classics
    locator: /classics
    sources: [src/app/classics/**, src/lib/category-shoes.ts, src/components/ProductGridWithFavorites.tsx, src/components/ProductCard.tsx, src/components/SaleSticker.tsx]
  - id: sale
    kind: page
    name: Sale
    locator: /sale
    description: Only shoes with a stock row that has sale_percent > 0.
    sources: [src/app/sale/**, src/lib/category-shoes.ts, src/components/ProductGridWithFavorites.tsx, src/components/ProductCard.tsx, src/components/SaleSticker.tsx]

  - id: shoe-detail
    kind: page
    name: Shoe detail
    locator: /shoe/:id
    description: Size selector (per-size sale stickers), add to bag modal, review feed.
    sources: [src/app/shoe/**, src/components/ShoeDetailContent.tsx, src/components/ShoeSizeSelector.tsx, src/components/SaleSticker.tsx, src/components/AddedToBagModal.tsx]
  - id: size-selector
    kind: form
    name: Size selector
    locator: "[data-size]"
    sources: [src/components/ShoeSizeSelector.tsx, src/components/SaleSticker.tsx]
  - id: add-to-bag
    kind: button
    name: Add to bag
    locator: "button:has-text('Add to Bag')"
    sources: [src/components/ShoeDetailContent.tsx, src/components/AddedToBagModal.tsx, src/app/api/cart/route.ts]
  - id: favorite-heart
    kind: button
    name: Favorite heart
    locator: "[aria-label*='avorite']"
    sources: [src/components/FavoriteHeart.tsx, src/app/api/favorites/**]
  - id: review-feed
    kind: form
    name: Reviews on shoe detail
    locator: /shoe/:id
    sources: [src/components/ReviewFeed.tsx, src/app/api/reviews/**, "src/app/api/shoes/*/reviews/**"]

  - id: cart
    kind: page
    name: Bag
    locator: /cart
    sources: [src/app/cart/**, src/app/api/cart/**]
  - id: checkout
    kind: flow
    name: Checkout
    locator: /checkout
    description: Bag summary, discount code, place order.
    sources: [src/app/checkout/**, src/app/api/checkout/**, src/app/api/discount/**]
  - id: favorites
    kind: page
    name: Favorites
    locator: /favorites
    sources: [src/app/favorites/**, src/components/FavoriteHeart.tsx]
  - id: login
    kind: form
    name: Login / sign up
    locator: /login
    sources: [src/app/login/**, src/lib/supabase.ts]
  - id: profile
    kind: page
    name: Profile and purchases
    locator: /profile
    description: Purchased shoes and the review form for them.
    sources: [src/app/profile/**, src/app/api/profile/**]

  # API endpoints
  - id: api-cart
    kind: endpoint
    name: GET/POST /api/cart
    locator: /api/cart
    sources: [src/app/api/cart/route.ts]
  - id: api-cart-item
    kind: endpoint
    name: DELETE /api/cart/[id]
    locator: /api/cart/:id
    sources: ["src/app/api/cart/[[]id]/**"]
  - id: api-checkout
    kind: endpoint
    name: POST /api/checkout
    locator: /api/checkout
    sources: [src/app/api/checkout/**]
  - id: api-discount-validate
    kind: endpoint
    name: POST /api/discount/validate
    locator: /api/discount/validate
    sources: [src/app/api/discount/**]
  - id: api-favorites-toggle
    kind: endpoint
    name: POST /api/favorites/toggle
    locator: /api/favorites/toggle
    sources: [src/app/api/favorites/**]
  - id: api-purchases
    kind: endpoint
    name: GET /api/profile/purchases
    locator: /api/profile/purchases
    sources: [src/app/api/profile/**]
  - id: api-reviews
    kind: endpoint
    name: POST /api/reviews and GET /api/shoes/[id]/reviews
    locator: /api/reviews
    sources: [src/app/api/reviews/**, "src/app/api/shoes/*/reviews/**"]
  - id: api-stock
    kind: endpoint
    name: GET /api/shoes/[id]/stock
    locator: /api/shoes/:id/stock
    sources: ["src/app/api/shoes/*/stock/**"]

  # --- Page sections and shared chrome ---
  - id: promo-banner
    kind: page
    name: Promo banner
    locator: "header"
    description: Top banner advertising a first-order discount code.
    sources: [src/components/StorefrontLayout.tsx]
  - id: home-hero
    kind: page
    name: Home hero
    locator: /
    description: Large hero image with SHOP ALL, ADJUSTABLE and SOFT PAD callouts.
    sources: [src/components/StorefrontLayout.tsx, src/app/page.tsx]
  - id: home-new-arrivals
    kind: page
    name: Home, New Arrivals tab
    locator: /?tab=new-arrivals
    sources: [src/app/page.tsx, src/components/StorefrontLayout.tsx, src/components/ProductGridWithFavorites.tsx]
  - id: home-whats-trending
    kind: page
    name: Home, What's Trending tab
    locator: /?tab=whats-trending
    sources: [src/app/page.tsx, src/components/StorefrontLayout.tsx, src/components/ProductGridWithFavorites.tsx]
  - id: nav-logo
    kind: button
    name: Nav logo
    locator: "nav a[href='/']"
    sources: [src/components/NavBar.tsx]
  - id: nav-category-links
    kind: button
    name: Nav category links
    locator: "nav ul a"
    description: Women, Men, Kids, Classics, Sport, Sale; the current category is underlined.
    sources: [src/components/NavBar.tsx]
  - id: nav-bag-icon
    kind: button
    name: Nav bag icon and count badge
    locator: "nav a[href='/cart']"
    description: Badge shows the total quantity in the bag, 99+ above 99.
    sources: [src/components/NavBar.tsx, src/app/api/cart/route.ts]
  - id: nav-favorites-icon
    kind: button
    name: Nav favorites icon
    locator: "nav a[href='/favorites']"
    sources: [src/components/NavBar.tsx]
  - id: nav-account-icon
    kind: button
    name: Nav account icon
    locator: "nav a[href='/profile'], nav a[href='/login']"
    description: Goes to the profile when signed in, to login when signed out.
    sources: [src/components/NavBar.tsx]
  - id: footer
    kind: page
    name: Footer
    locator: "footer"
    sources: [src/components/StorefrontLayout.tsx]
  - id: footer-social-links
    kind: button
    name: Footer social links
    locator: "footer a[target='_blank']"
    description: Facebook, Instagram, X, LinkedIn and YouTube icons.
    sources: [src/components/StorefrontLayout.tsx]

  # --- Browsing ---
  - id: product-card
    kind: button
    name: Product card
    locator: "a[href^='/shoe/']"
    description: Image, name, price or sale price with sticker, star rating and review count, favorite heart.
    sources: [src/components/ProductCard.tsx, src/components/SaleSticker.tsx, src/components/FavoriteHeart.tsx, src/types/database.ts]
  - id: product-grid-empty
    kind: page
    name: Empty product grid
    locator: /favorites
    description: What a category or favorites grid shows when it has no shoes.
    sources: [src/components/ProductGridWithFavorites.tsx, src/components/StorefrontLayout.tsx]
  - id: shoe-not-found
    kind: page
    name: Shoe page for an unknown id
    locator: /shoe/:unknown-id
    sources: ["src/app/shoe/[[]id]/**"]
  - id: shoe-price
    kind: page
    name: Shoe page price and sale sticker
    locator: /shoe/:id
    description: Lowest available price until a size is selected, then that size's price; original price struck through when on sale.
    sources: [src/components/ShoeDetailContent.tsx, src/components/SaleSticker.tsx, src/types/database.ts]
  - id: quantity-select
    kind: form
    name: Quantity select
    locator: "select"
    description: 1 to 9 on the shoe page; the API accepts up to 99.
    sources: [src/components/ShoeSizeSelector.tsx]
  - id: added-to-bag-modal
    kind: flow
    name: Added to bag modal
    locator: "[role='dialog']"
    description: Confirms the shoe, size (M and W), price, and bag count, with View Bag and Checkout links.
    sources: [src/components/AddedToBagModal.tsx, src/components/ShoeDetailContent.tsx]
  - id: review-list
    kind: page
    name: Review list
    locator: /shoe/:id
    description: Newest first, stars, date, optional text; empty state when there are no reviews.
    sources: [src/components/ReviewFeed.tsx, "src/app/api/shoes/*/reviews/**"]

  # --- Bag and checkout ---
  - id: cart-line-item
    kind: page
    name: Bag line item
    locator: /cart
    description: Name, size, quantity, and line price for one bag entry.
    sources: [src/app/cart/**]
  - id: cart-remove-item
    kind: button
    name: Remove from bag
    locator: /cart
    sources: [src/app/cart/**, "src/app/api/cart/[[]id]/**"]
  - id: cart-empty
    kind: page
    name: Empty bag
    locator: /cart
    sources: [src/app/cart/**]
  - id: checkout-contact-form
    kind: form
    name: Checkout contact and delivery
    locator: "#checkout-email"
    description: Email, name, address, city, state, ZIP, country. Display only.
    sources: [src/app/checkout/**]
  - id: checkout-payment-form
    kind: form
    name: Checkout payment
    locator: "#checkout-card-number"
    description: Name on card, card number, expiry, CVV. Display only; no payment is processed.
    sources: [src/app/checkout/**]
  - id: checkout-promo-code
    kind: form
    name: Checkout promo code
    locator: "input[aria-label='Discount code']"
    description: Uppercases input, validates against the current subtotal, shows the discount or an error.
    sources: [src/app/checkout/**, src/app/api/discount/**]
  - id: checkout-order-summary
    kind: page
    name: Checkout order summary
    locator: /checkout
    description: In your bag, subtotal, discount, and total.
    sources: [src/app/checkout/**, src/types/database.ts]
  - id: place-order
    kind: button
    name: Place order
    locator: "button:has-text('Place order')"
    description: Disabled while loading or when the bag is empty; returns to home on success.
    sources: [src/app/checkout/**, src/app/api/checkout/**]

  # --- Account ---
  - id: login-error-state
    kind: form
    name: Login error state
    locator: /login
    description: Inline error for wrong credentials or empty fields.
    sources: [src/app/login/**]
  - id: auth-redirects
    kind: flow
    name: Signed-out redirects
    locator: /cart
    description: Bag, checkout, favorites, and profile send signed-out shoppers to login.
    sources: [src/app/cart/**, src/app/checkout/**, src/app/favorites/**, src/app/profile/**, src/components/ShoeDetailContent.tsx]
  - id: profile-purchases
    kind: page
    name: Profile purchase list
    locator: /profile
    description: Each purchased shoe with its purchase date and review status; empty state when there are none.
    sources: [src/app/profile/**, src/app/api/profile/**]
  - id: profile-review-form
    kind: form
    name: Profile review form
    locator: /profile
    description: Star rating and optional text for a purchased shoe not yet reviewed.
    sources: [src/app/profile/**, src/app/api/reviews/**]
  - id: favorites-empty
    kind: page
    name: Empty favorites
    locator: /favorites
    sources: [src/app/favorites/**]

invariants:
  - id: discount-counted-on-order
    statement: >-
      A discount code's used_count increases only when an order is actually
      created with that code, and never beyond max_uses.
    severity: P0
    surfaces: [checkout, api-checkout, api-discount-validate]
  - id: order-total-matches-bag
    statement: >-
      An order's total equals the sum of unit price x quantity, where unit price
      is msrp x (1 - sale_percent/100) for that size and color, minus the applied
      discount, and is never below zero.
    severity: P0
    check: order.total == max(0, sum(item.msrp * (1 - item.sale_percent / 100) * item.quantity) - discount)
    surfaces: [checkout, cart, api-checkout]
  - id: checkout-success-means-order
    statement: >-
      Checkout reports success only if an order with all bag items was created;
      stock is deducted and the bag is cleared only in that case.
    severity: P0
    surfaces: [checkout, api-checkout]
  - id: no-overselling
    statement: >-
      Stock quantity never goes below zero and an order never includes more units
      of a size and color than were available when it was placed.
    severity: P0
    surfaces: [add-to-bag, checkout, api-cart, api-checkout, api-stock]
  - id: own-data-only
    statement: >-
      A shopper can only read or change their own bag items, favorites, orders and
      reviews; requests for another user's records fail.
    severity: P0
    surfaces: [cart, favorites, profile, api-cart, api-cart-item, api-favorites-toggle, api-purchases, api-reviews]
  - id: reserved-stock-released
    statement: Removing an item from the bag releases exactly the stock it had reserved.
    severity: P1
    surfaces: [cart, api-cart-item, api-stock]
  - id: sale-price-parity
    statement: >-
      The sale sticker and price shown for a size on the product card and shoe
      page match the unit price charged in the bag and at checkout.
    severity: P1
    surfaces: [sale, shoe-detail, size-selector, cart, checkout]
  - id: reviews-require-purchase
    statement: >-
      A shopper can review a shoe only after purchasing it, at most once per shoe,
      with a rating from 1 to 5.
    severity: P1
    surfaces: [review-feed, profile, api-reviews, api-purchases]
  - id: pages-scroll
    statement: >-
      Every page can be scrolled to its footer with the mouse wheel or trackpad,
      not only with the keyboard.
    severity: P1
    surfaces: [layout-nav, home, category-men, cart, checkout]
  - id: bag-count-matches-bag
    statement: The bag count in the nav bar equals the total quantity of items on the bag page.
    severity: P2
    surfaces: [layout-nav, cart]
  - id: favorite-toggle-roundtrip
    statement: Toggling a favorite twice returns the shoe to its original favorited state everywhere it is shown.
    severity: P2
    surfaces: [favorite-heart, favorites, api-favorites-toggle]

  - id: add-more-of-same-size
    statement: >-
      Adding more of a size and color already in the bag succeeds whenever
      enough unreserved stock remains, and is refused only when it does not.
    severity: P1
    surfaces: [add-to-bag, api-cart, cart]
  - id: stocked-sizes-selectable
    statement: >-
      Every size with available stock can be selected and added to the bag,
      including kids' sizes, and sizes with no available stock cannot be.
    severity: P1
    surfaces: [size-selector, shoe-detail, category-kids, add-to-bag]
  - id: order-matches-bag
    statement: >-
      A placed order contains exactly the bag's items (shoe, size, color,
      quantity, unit price) at the moment of checkout, and the bag is empty
      afterwards.
    severity: P0
    surfaces: [place-order, checkout-order-summary, api-checkout, cart]
  - id: discount-rules-enforced
    statement: >-
      Expired, not-yet-valid, used-up, and below-minimum discount codes are
      rejected both when applied and when the order is placed, and a rejected
      code never reduces the order total.
    severity: P0
    surfaces: [checkout-promo-code, api-discount-validate, api-checkout]
  - id: advertised-code-works
    statement: >-
      Any discount code advertised on the site (for example in the promo
      banner) is accepted at checkout under its advertised terms.
    severity: P1
    surfaces: [promo-banner, checkout-promo-code, api-discount-validate]
  - id: exact-price-display
    statement: >-
      Prices are shown to the cent everywhere a price appears (cards, shoe page,
      bag modal, bag, checkout); a $97.50 price is never shown as $98 or $97.5.
    severity: P2
    surfaces: [product-card, shoe-price, added-to-bag-modal, cart-line-item, checkout-order-summary]
  - id: card-price-matches-shoe-page
    statement: >-
      The price and sale sticker on a product card match the lowest price and
      sticker on that shoe's page, considering only sizes that are in stock.
    severity: P2
    surfaces: [product-card, shoe-price, sale]
  - id: checkout-total-math
    statement: >-
      The checkout summary's total equals its subtotal minus the applied
      discount, and the subtotal equals the sum of the bag's line prices.
    severity: P1
    check: summary.total == max(0, summary.subtotal - summary.discount) && summary.subtotal == sum(bag.lines[].price)
    surfaces: [checkout-order-summary, checkout-promo-code, cart-line-item]
  - id: empty-bag-cannot-order
    statement: >-
      Place order is unavailable with an empty bag, and the checkout API
      rejects an empty bag without creating an order.
    severity: P1
    surfaces: [place-order, cart-empty, api-checkout]
  - id: signed-out-protected
    statement: >-
      Signed-out shoppers are sent to login from the bag, checkout, favorites,
      and profile, and no bag, favorite, review, or order change can be made
      without signing in.
    severity: P0
    surfaces: [auth-redirects, api-cart, api-checkout, api-favorites-toggle, api-reviews]
  - id: failed-actions-explain
    statement: >-
      When adding to the bag, favoriting, removing an item, applying a code,
      or placing an order fails, the shopper sees a message saying so; nothing
      fails silently.
    severity: P2
    surfaces: [add-to-bag, favorite-heart, cart-remove-item, checkout-promo-code, place-order]
  - id: category-pages-filter
    statement: >-
      Each category page lists exactly its shoes: Men and Women by gender, Kids
      by age, Sport and Classics by their flags, and Sale only shoes with an
      in-stock variant on sale.
    severity: P1
    surfaces: [category-men, category-women, category-kids, category-sport, category-classics, sale]
  - id: bag-modal-accurate
    statement: >-
      The added-to-bag modal shows the size, price, and updated bag count for
      what was actually added.
    severity: P2
    surfaces: [added-to-bag-modal, nav-bag-icon, add-to-bag]
  - id: account-icon-destination
    statement: >-
      The nav account icon goes to the profile when signed in and to login
      when signed out, and a signed-in shopper can sign out.
    severity: P2
    surfaces: [nav-account-icon, profile, login]
  - id: unknown-ids-not-found
    statement: >-
      Unknown shoe ids and cart item ids return a not-found page or 404, never a
      crash or a 500.
    severity: P2
    surfaces: [shoe-not-found, api-stock, api-reviews, api-cart-item]
  - id: api-rejects-bad-input
    statement: >-
      API routes answer malformed JSON, missing fields, and out-of-range values
      (quantity, rating) with a 4xx and a readable error, never a 500.
    severity: P2
    surfaces: [api-cart, api-cart-item, api-checkout, api-discount-validate, api-favorites-toggle, api-reviews]
  - id: purchase-date-latest
    statement: >-
      A shoe bought more than once shows its most recent purchase date on the
      profile.
    severity: P3
    surfaces: [profile-purchases, api-purchases]
  - id: footer-links-named
    statement: Each footer social icon opens the network it is labeled with.
    severity: P3
    surfaces: [footer-social-links]

boundaries:
  - Use only the storefront's pages and its /api routes; never call Supabase directly with the anon key.
  - Never create, edit or delete shoes, stock rows or discount codes except through shopper actions in the app.
  - Only sign in as the provided test accounts; do not sign up new real-looking accounts with real email addresses.
  - Do not use real payment details or real personal data.
